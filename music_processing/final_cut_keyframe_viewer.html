<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Final Cut + Keyframe Timing Viewer</title>
  <style>
    :root {
      --ink: #17201a;
      --muted: #647066;
      --paper: #f7f0df;
      --panel: #fffaf0;
      --line: #d8cdbb;
      --score: #d43d7d;
      --cut: #111418;
      --key: #108d72;
      --gt-cut: #47515c;
      --gt-key: #355c7d;
      --coverage: #efb55f;
      --playhead: #1677c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(239, 181, 95, 0.28), transparent 35rem),
        linear-gradient(135deg, #f8f1df 0%, #ecf3e8 100%);
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    }
    main {
      width: min(1760px, calc(100vw - 28px));
      margin: 18px auto 40px;
    }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 16px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 4px;
      letter-spacing: -0.045em;
      font-size: clamp(25px, 3vw, 40px);
    }
    .subtitle { color: var(--muted); font-size: 14px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }
    select, input, button {
      border: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.92);
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 13px;
      font: inherit;
      font-size: 14px;
    }
    input { width: 180px; }
    button { cursor: pointer; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(320px, 0.72fr);
      gap: 16px;
      align-items: start;
    }
    .card {
      border: 1px solid rgba(23, 32, 26, 0.12);
      background: rgba(255, 250, 240, 0.86);
      box-shadow: 0 16px 40px rgba(31, 35, 30, 0.10);
      border-radius: 24px;
      padding: 15px;
      backdrop-filter: blur(10px);
    }
    video {
      width: 100%;
      max-height: 64vh;
      display: block;
      background: #111;
      border-radius: 18px;
    }
    .timeline-card { margin-top: 14px; }
    canvas {
      width: 100%;
      height: 520px;
      display: block;
      border-radius: 18px;
      background: linear-gradient(180deg, #fffdf7 0%, #f4efe2 100%);
      border: 1px solid var(--line);
      cursor: crosshair;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 11px 2px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 18px;
      height: 4px;
      border-radius: 999px;
      display: inline-block;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.48);
    }
    .stat b {
      display: block;
      font-size: 18px;
      letter-spacing: -0.03em;
    }
    .stat small { color: var(--muted); }
    .event-list {
      max-height: 58vh;
      overflow: auto;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .event-row {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 3px;
      border-bottom: 1px solid rgba(216, 205, 187, 0.65);
      font-size: 13px;
    }
    .event-row button {
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .pill.cut { background: rgba(17, 20, 24, 0.12); color: var(--cut); }
    .pill.keyframe { background: rgba(16, 141, 114, 0.13); color: var(--key); }
    .pill.gt { background: rgba(53, 92, 125, 0.12); color: var(--gt-key); }
    .empty { color: var(--muted); padding: 20px 4px; font-size: 14px; }
    @media (max-width: 980px) {
      .topbar, .layout { grid-template-columns: 1fr; }
      .controls { justify-content: flex-start; }
      input { width: min(100%, 240px); }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <h1 id="title">Final Cut + Keyframe Timing</h1>
        <div id="subtitle" class="subtitle">Loading final timing result...</div>
      </div>
      <div class="controls">
        <input id="search" placeholder="Filter song id..." />
        <select id="songSelect"></select>
        <button id="prevBtn" type="button">Prev</button>
        <button id="nextBtn" type="button">Next</button>
      </div>
    </div>

    <div class="layout">
      <section>
        <div class="card">
          <video id="video" controls playsinline></video>
        </div>
        <div class="card timeline-card">
          <canvas id="timeline"></canvas>
          <div class="legend">
            <span><i class="swatch" style="background: var(--score)"></i>keyframe score, if available</span>
            <span><i class="swatch" style="background: var(--key)"></i>selected keyframe</span>
            <span><i class="swatch" style="background: var(--cut)"></i>selected cut</span>
            <span><i class="swatch" style="background: var(--gt-key)"></i>GT keyframe</span>
            <span><i class="swatch" style="background: var(--gt-cut)"></i>GT cut</span>
            <span><i class="swatch" style="background: var(--coverage)"></i>coverage</span>
            <span><i class="swatch" style="background: var(--playhead)"></i>playhead</span>
          </div>
        </div>
      </section>

      <aside class="card">
        <h2 id="sideTitle">Summary</h2>
        <div id="stats" class="stats"></div>
        <div id="events" class="event-list"></div>
      </aside>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const RESULT_URL = params.get("result") || "";
    // Songs without a source video (e.g. demo runs) fall back to the preview MP4 passed as ?video=.
    const FALLBACK_VIDEO_URL = params.get("video") || "";
    const state = {
      result: null,
      songs: [],
      filtered: [],
      song: null,
      playhead: 0,
    };

    const els = {
      title: document.getElementById("title"),
      subtitle: document.getElementById("subtitle"),
      search: document.getElementById("search"),
      select: document.getElementById("songSelect"),
      prev: document.getElementById("prevBtn"),
      next: document.getElementById("nextBtn"),
      video: document.getElementById("video"),
      canvas: document.getElementById("timeline"),
      sideTitle: document.getElementById("sideTitle"),
      stats: document.getElementById("stats"),
      events: document.getElementById("events"),
    };

    const fmt = (value, digits = 3) => Number(value || 0).toFixed(digits);
    const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    function viewerUrl(src) {
      if (!src) return "";
      if (/^(https?:|file:|data:|blob:)/.test(src)) return src;
      const normalized = String(src).replace(/\\/g, "/").replace(/^\/+/, "");
      return `/${normalized}`;
    }

    async function fetchJson(url) {
      const response = await fetch(viewerUrl(url));
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${url}`);
      return response.json();
    }

    function setupCanvas() {
      const rect = els.canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(900, Math.floor(rect.width * dpr));
      const height = Math.max(420, Math.floor(rect.height * dpr));
      if (els.canvas.width !== width || els.canvas.height !== height) {
        els.canvas.width = width;
        els.canvas.height = height;
      }
      const ctx = els.canvas.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      return { ctx, width, height, dpr };
    }

    function selectSongs() {
      const query = els.search.value.trim().toLowerCase();
      state.filtered = state.songs.filter((song) => !query || song.id.toLowerCase().includes(query));
      els.select.innerHTML = state.filtered.map((song) => `<option value="${song.id}">${song.id}</option>`).join("");
    }

    function loadSong(songId) {
      const song = state.songs.find((item) => item.id === songId) || state.filtered[0] || state.songs[0];
      if (!song) return;
      state.song = song;
      els.select.value = song.id;
      els.video.src = viewerUrl(song.video_src || FALLBACK_VIDEO_URL);
      els.title.textContent = `${song.id} | Final Cut + Keyframe Timing`;
      els.sideTitle.textContent = `${song.id} | ${song.split || "test"} split`;
      renderStats();
      renderEvents();
      drawTimeline();
    }

    function move(offset) {
      if (!state.filtered.length || !state.song) return;
      const index = state.filtered.findIndex((song) => song.id === state.song.id);
      const next = (index + offset + state.filtered.length) % state.filtered.length;
      loadSong(state.filtered[next].id);
    }

    function renderStats() {
      const song = state.song;
      const c = song.counts || {};
      // Evaluation exports keep the settings per song; demo runs keep them at the top level.
      const s = song.selection || state.result.selection || {};
      const b = song.density_budget || {};
      const densityCut = s.density_cut_percent ?? b.density_cut_percent;
      const rows = [
        ["Final cuts", c.selected_cut_count],
        ["Final keyframes", c.selected_keyframe_count ?? c.selected_noncut_keyframe_count],
        ["Target cuts", c.target_cut_count ?? b.cut_budget_requested],
        ["Target keyframes", c.target_keyframe_count ?? b.noncut_keyframe_budget],
        ["Total budget", c.total_event_budget ?? b.total_keyframe_budget],
        ["GT cuts", c.gt_cut_count],
        ["GT keyframes", c.gt_keyframe_count],
        ["Mode", s.keyframe_selection_mode],
        ["Cut mode", s.cut_selection_mode],
        ["Density cut %", densityCut === undefined ? undefined : `${fmt(densityCut, 1)}%`],
      ].filter(([, value]) => value !== undefined && value !== null);
      els.stats.innerHTML = rows.map(([label, value]) => (
        `<div class="stat"><b>${value}</b><small>${label}</small></div>`
      )).join("");
      const aggregate = state.result.aggregate || {};
      const total = (key) => state.songs.reduce((sum, item) => sum + Number(item.counts?.[key] || 0), 0);
      const keyframeTotal = aggregate.selected_keyframe_count ?? (total("selected_keyframe_count") || total("selected_noncut_keyframe_count"));
      els.subtitle.textContent = `${state.result.dataset_type || "final_cut_key_timings"} | songs ${aggregate.song_count || state.songs.length} | cuts ${aggregate.selected_cut_count ?? total("selected_cut_count")} | keyframes ${keyframeTotal}`;
    }

    function renderEvents() {
      const song = state.song;
      const selectionMode = song.selection?.keyframe_selection_mode || "";
      const selected = [
        ...(song.selected_cuts || []).map((event) => ({ ...event, type: "cut" })),
        ...(song.selected_keyframes || []).map((event) => ({ ...event, type: "keyframe" })),
      ].sort((a, b) => Number(a.time_sec) - Number(b.time_sec) || (a.type === "cut" ? -1 : 1));
      if (!selected.length) {
        els.events.innerHTML = `<div class="empty">No selected cut/keyframe events.</div>`;
        return;
      }
      els.events.innerHTML = selected.map((event) => {
        let scoreText = `p ${fmt(event.probability, 2)}`;
        if (event.type === "keyframe" && selectionMode === "random") {
          scoreText = `random rank ${event.random_rank ?? "-"}`;
        } else if (event.type === "keyframe") {
          scoreText = `score ${fmt(event.score, 2)} | D ${fmt(event.dance_motion_saliency, 2)} M ${fmt(event.music_accent_saliency, 2)} S ${fmt(event.music_dance_sync_bonus, 2)} B ${fmt(event.beat_or_downbeat_bonus, 2)}`;
        }
        return `
          <div class="event-row">
            <span class="pill ${event.type}">${event.type === "cut" ? "Cut" : "Key"}</span>
            <span>${fmt(event.time_sec, 3)}s | f${event.frame} | ${scoreText}</span>
            <button type="button" data-time="${event.time_sec}">Go</button>
          </div>
        `;
      }).join("");
      els.events.querySelectorAll("button[data-time]").forEach((button) => {
        button.addEventListener("click", () => {
          els.video.currentTime = Number(button.dataset.time || 0);
          els.video.play().catch(() => {});
        });
      });
    }

    function drawLineEvents(ctx, events, xOf, top, bottom, color, width = 1.4) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      for (const event of events || []) {
        const x = xOf(Number(event.time_sec || 0));
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, bottom);
        ctx.stroke();
      }
    }

    function drawTimeline() {
      if (!state.song) return;
      const { ctx, width, height } = setupCanvas();
      const song = state.song;
      const duration = Math.max(0.001, Number(song.video_duration_sec || els.video.duration || 1));
      const xOf = (time) => Math.max(0, Math.min(width, Number(time) / duration * width));

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#fffdf7";
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = "rgba(23, 32, 26, 0.09)";
      ctx.lineWidth = 1;
      for (let t = 0; t <= duration; t += 5) {
        const x = xOf(t);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      for (const segment of song.coverage_segments || []) {
        const x1 = xOf(segment.start_time_sec);
        const x2 = xOf(segment.end_time_sec);
        ctx.fillStyle = "rgba(239, 181, 95, 0.20)";
        ctx.fillRect(x1, 0, Math.max(1, x2 - x1), height);
      }

      const bands = {
        score: [60, 180],
        key: [205, 255],
        cut: [275, 325],
        gtKey: [350, 400],
        gtCut: [425, 475],
      };
      ctx.strokeStyle = "rgba(23, 32, 26, 0.09)";
      for (const [top, bottom] of Object.values(bands)) {
        ctx.beginPath();
        ctx.moveTo(0, top);
        ctx.lineTo(width, top);
        ctx.moveTo(0, bottom);
        ctx.lineTo(width, bottom);
        ctx.stroke();
      }

      const scoreSamples = song.keyframe_score_series || [];
      if (scoreSamples.length) {
        ctx.strokeStyle = cssVar("--score");
        ctx.lineWidth = 2;
        ctx.beginPath();
        scoreSamples.forEach((sample, index) => {
          const x = xOf(sample.time_sec);
          const value = Math.max(0, Math.min(1, Number(sample.value || 0)));
          const y = bands.score[1] - value * (bands.score[1] - bands.score[0]);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      drawLineEvents(ctx, song.selected_keyframes, xOf, bands.key[0], bands.key[1], cssVar("--key"), 2.2);
      drawLineEvents(ctx, song.selected_cuts, xOf, bands.cut[0], bands.cut[1], cssVar("--cut"), 2.2);
      drawLineEvents(ctx, song.gt_keyframe_events, xOf, bands.gtKey[0], bands.gtKey[1], cssVar("--gt-key"), 1.2);
      drawLineEvents(ctx, song.gt_cut_events, xOf, bands.gtCut[0], bands.gtCut[1], cssVar("--gt-cut"), 1.2);

      const playX = xOf(els.video.currentTime || 0);
      ctx.strokeStyle = cssVar("--playhead");
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(playX, 0);
      ctx.lineTo(playX, height);
      ctx.stroke();

      ctx.fillStyle = "rgba(23, 32, 26, 0.66)";
      ctx.font = "12px Segoe UI, sans-serif";
      ctx.fillText("keyframe score", 12, bands.score[0] + 16);
      ctx.fillText("selected keyframes", 12, bands.key[0] + 18);
      ctx.fillText("selected cuts", 12, bands.cut[0] + 18);
      ctx.fillText("GT keyframes", 12, bands.gtKey[0] + 18);
      ctx.fillText("GT cuts", 12, bands.gtCut[0] + 18);
    }

    async function init() {
      if (!RESULT_URL) throw new Error("open this page from the demo page, or pass ?result=/path/to/final_cut_key_timings.json");
      state.result = await fetchJson(RESULT_URL);
      state.songs = state.result.songs || [];
      selectSongs();
      els.search.addEventListener("input", () => {
        selectSongs();
        if (state.filtered.length) loadSong(state.filtered[0].id);
      });
      els.select.addEventListener("change", () => loadSong(els.select.value));
      els.prev.addEventListener("click", () => move(-1));
      els.next.addEventListener("click", () => move(1));
      els.video.addEventListener("timeupdate", drawTimeline);
      els.video.addEventListener("loadedmetadata", drawTimeline);
      window.addEventListener("resize", drawTimeline);
      els.canvas.addEventListener("click", (event) => {
        if (!state.song) return;
        const rect = els.canvas.getBoundingClientRect();
        const ratio = (event.clientX - rect.left) / Math.max(rect.width, 1);
        const duration = Number(state.song.video_duration_sec || els.video.duration || 0);
        els.video.currentTime = Math.max(0, Math.min(duration, ratio * duration));
      });
      loadSong(state.result.default_song_id || state.songs[0]?.id);
    }

    init().catch((error) => {
      console.error(error);
      els.subtitle.textContent = `Failed to load viewer data: ${error.message}`;
    });
  </script>
</body>
</html>
